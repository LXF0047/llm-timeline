# Place these locations inside the existing ai-aegis.com.cn server block.
location = /transformer {
  return 301 /transformer/;
}

location = /transformer/ {
  root /var/www/transformer-atlas/current;
  rewrite ^ /index.html break;
}

location = /transformer/og.png {
  alias /var/www/transformer-atlas/current/og.png;
  expires 7d;
  add_header Cache-Control "public, immutable";
}

location ^~ /transformer/assets/ {
  alias /var/www/transformer-atlas/current/assets/;
  expires 7d;
  add_header Cache-Control "public, immutable";
}
